<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya Construction Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">
    
    <!-- Login/Signup Screen -->
    <div id="authScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full border-2 border-indigo-100">
            <div class="text-center mb-8">
                <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-4 rounded-xl shadow-md inline-block mb-4">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-2">
                    Kenya Construction Tracker
                </h1>
                <p class="text-gray-500">Secure your construction projects</p>
            </div>

            <div id="loginForm">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Login</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" id="loginEmail" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="your@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                        <input type="password" id="loginPassword" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                    </div>
                    <button onclick="login()" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-3 rounded-xl hover:from-blue-600 hover:to-indigo-700 font-bold shadow-lg">
                        🔐 Login
                    </button>
                    <div class="text-center text-sm text-gray-600">
                        Don't have an account? 
                        <button onclick="showSignup()" class="text-blue-600 font-semibold hover:underline">Sign Up</button>
                    </div>
                </div>
            </div>

            <div id="signupForm" class="hidden">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Create Account</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                        <input type="email" id="signupEmail" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="your@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Password (min 6 characters)</label>
                        <input type="password" id="signupPassword" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                    </div>
                    <button onclick="signup()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-xl hover:from-green-600 hover:to-emerald-700 font-bold shadow-lg">
                        ✅ Create Account
                    </button>
                    <div class="text-center text-sm text-gray-600">
                        Already have an account? 
                        <button onclick="showLogin()" class="text-blue-600 font-semibold hover:underline">Login</button>
                    </div>
                </div>
            </div>

            <div id="authMessage" class="mt-4 text-center text-sm"></div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden p-4">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-indigo-100">
                <div class="flex items-center justify-between mb-4 flex-wrap gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-3 rounded-xl shadow-md">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                                Kenya Construction Tracker
                            </h1>
                            <p class="text-sm text-gray-500 mt-1">
                                <span id="userEmail"></span>
                            </p>
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="exportData()" class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl hover:from-green-600 hover:to-emerald-700 transition shadow-md">
                            Export
                        </button>
                        <button onclick="logout()" class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl hover:from-red-600 hover:to-red-700 transition shadow-md">
                            Logout
                        </button>
                    </div>
                </div>

                <div id="projectTabs" class="flex gap-2 flex-wrap mb-4"></div>

                <div id="budgetOverview"></div>
            </div>

            <div id="categoryBreakdown" class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-indigo-100">
                <h2 class="text-2xl font-bold mb-5 text-gray-800 flex items-center gap-2">
                    <span class="text-2xl">📊</span>
                    Spending by Category
                </h2>
                <div id="categoryGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-6 border border-indigo-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <span class="text-2xl">💰</span>
                        Expenses
                    </h2>
                    <button onclick="showAddExpenseModal()" class="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl hover:from-blue-600 hover:to-indigo-700 shadow-md">
                        ➕ Add Expense
                    </button>
                </div>
                <div id="expensesList"></div>
            </div>
        </div>
    </div>

    <!-- Modals will be inserted here by JavaScript -->
    <div id="modalContainer"></div>

    <script>
        // State
        let appState = {
            currentUser: null,
            projects: [
                { id: 1, name: 'Main House Construction', budget: 5000000, color: '#3b82f6' }
            ],
            expenses: [],
            activeProject: 1,
            exchangeRate: 129.5,
            lastActivity: Date.now()
        };

        const categories = [
            { name: 'Materials', icon: '🧱', color: 'bg-orange-100 text-orange-700 border-orange-300' },
            { name: 'Labor', icon: '👷', color: 'bg-blue-100 text-blue-700 border-blue-300' },
            { name: 'Equipment', icon: '🔧', color: 'bg-purple-100 text-purple-700 border-purple-300' },
            { name: 'Transportation', icon: '🚚', color: 'bg-green-100 text-green-700 border-green-300' },
            { name: 'Professional Fees', icon: '👨‍💼', color: 'bg-indigo-100 text-indigo-700 border-indigo-300' },
            { name: 'Permits', icon: '📋', color: 'bg-yellow-100 text-yellow-700 border-yellow-300' },
            { name: 'Utilities', icon: '⚡', color: 'bg-cyan-100 text-cyan-700 border-cyan-300' },
            { name: 'Other', icon: '📦', color: 'bg-gray-100 text-gray-700 border-gray-300' }
        ];

        // Authentication
        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('authMessage');
            messageDiv.textContent = message;
            messageDiv.className = `mt-4 text-center text-sm p-3 rounded-xl ${
                type === 'error' ? 'bg-red-100 text-red-700' :
                type === 'success' ? 'bg-green-100 text-green-700' :
                type === 'warning' ? 'bg-yellow-100 text-yellow-700' :
                'bg-blue-100 text-blue-700'
            }`;
            setTimeout(() => messageDiv.textContent = '', 5000);
        }

        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        function signup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[email]) {
                showMessage('Email already exists. Please login.', 'error');
                return;
            }

            users[email] = { email, password, createdAt: new Date().toISOString() };
            localStorage.setItem('users', JSON.stringify(users));
            showMessage('Account created successfully! Please login.', 'success');
            showLogin();
        }

        function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '{}');
            const user = users[email];

            if (!user || user.password !== password) {
                showMessage('Invalid email or password', 'error');
                return;
            }

            appState.currentUser = { email };
            appState.lastActivity = Date.now();
            loadUserData();
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userEmail').textContent = email;
            renderApp();
        }

        function logout() {
            saveUserData();
            appState.currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function loadUserData() {
            if (!appState.currentUser) return;
            const savedData = JSON.parse(localStorage.getItem(`userData_${appState.currentUser.email}`) || '{}');
            if (savedData.projects) appState.projects = savedData.projects;
            if (savedData.expenses) appState.expenses = savedData.expenses;
        }

        function saveUserData() {
            if (!appState.currentUser) return;
            const userData = {
                projects: appState.projects,
                expenses: appState.expenses
            };
            localStorage.setItem(`userData_${appState.currentUser.email}`, JSON.stringify(userData));
        }

        // Format currency
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-KE', {
                style: 'currency',
                currency: 'KES',
                minimumFractionDigits: 0
            }).format(amount);
        }

        function formatUSD(kesAmount) {
            const usdAmount = kesAmount / appState.exchangeRate;
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(usdAmount);
        }

        // Render functions
        function renderApp() {
            renderProjectTabs();
            renderBudgetOverview();
            renderCategoryBreakdown();
            renderExpenses();
            saveUserData();
        }

        function renderProjectTabs() {
            const container = document.getElementById('projectTabs');
            const currentProject = appState.projects.find(p => p.id === appState.activeProject);
            
            container.innerHTML = appState.projects.map(project => `
                <button 
                    onclick="setActiveProject(${project.id})"
                    class="px-5 py-2.5 rounded-xl font-semibold transition-all ${
                        appState.activeProject === project.id
                            ? 'text-white shadow-lg scale-105'
                            : 'bg-white text-gray-700 hover:bg-gray-50 border-2 border-gray-200'
                    }"
                    style="${appState.activeProject === project.id ? `background-color: ${project.color}` : ''}"
                >
                    ${project.name}
                </button>
            `).join('') + `
                <button 
                    onclick="showAddProjectModal()"
                    class="px-5 py-2.5 bg-white text-gray-700 rounded-xl hover:bg-gray-50 transition-all flex items-center gap-2 border-2 border-dashed border-gray-300"
                >
                    ➕ New Project
                </button>
            `;
        }

        function renderBudgetOverview() {
            const project = appState.projects.find(p => p.id === appState.activeProject);
            if (!project) return;

            const projectExpenses = appState.expenses.filter(exp => exp.projectId === appState.activeProject);
            const totalSpent = projectExpenses.reduce((sum, exp) => sum + exp.amount, 0);
            const remaining = project.budget - totalSpent;
            const percentageUsed = (totalSpent / project.budget) * 100;

            document.getElementById('budgetOverview').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-3">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl p-5 border border-blue-200 shadow-sm">
                        <p class="text-sm text-blue-600 font-semibold mb-2">💰 Total Budget</p>
                        <p class="text-3xl font-bold text-blue-900">${formatCurrency(project.budget)}</p>
                        <p class="text-xs text-blue-600 mt-1 bg-blue-50 px-2 py-1 rounded-full inline-block">
                            ${formatUSD(project.budget)}
                        </p>
                    </div>
                    <div class="bg-gradient-to-br from-red-50 to-red-100 rounded-xl p-5 border border-red-200 shadow-sm">
                        <p class="text-sm text-red-600 font-semibold mb-2">💸 Total Spent</p>
                        <p class="text-3xl font-bold text-red-900">${formatCurrency(totalSpent)}</p>
                        <p class="text-xs text-red-600 mt-1 bg-red-50 px-2 py-1 rounded-full inline-block">
                            ${formatUSD(totalSpent)}
                        </p>
                    </div>
                    <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-xl p-5 border border-green-200 shadow-sm">
                        <p class="text-sm text-green-600 font-semibold mb-2">💵 Remaining</p>
                        <p class="text-3xl font-bold text-green-900">${formatCurrency(remaining)}</p>
                        <p class="text-xs text-green-600 mt-1 bg-green-50 px-2 py-1 rounded-full inline-block">
                            ${formatUSD(remaining)}
                        </p>
                    </div>
                </div>
                <div class="text-right mb-4">
                    <p class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full inline-block">
                        💱 Exchange Rate: 1 USD = ${appState.exchangeRate} KES
                    </p>
                </div>
                <div class="mt-4">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="font-semibold text-gray-700">Budget Used</span>
                        <span class="font-bold text-gray-900">${percentageUsed.toFixed(1)}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-4 shadow-inner">
                        <div class="h-4 rounded-full transition-all duration-500" style="
                            width: ${Math.min(percentageUsed, 100)}%;
                            background: ${percentageUsed > 90 
                                ? 'linear-gradient(to right, #ef4444, #dc2626)' 
                                : percentageUsed > 75 
                                ? 'linear-gradient(to right, #f59e0b, #d97706)' 
                                : 'linear-gradient(to right, #10b981, #059669)'}
                        "></div>
                    </div>
                </div>
            `;
        }

        function renderCategoryBreakdown() {
            const projectExpenses = appState.expenses.filter(exp => exp.projectId === appState.activeProject);
            const container = document.getElementById('categoryGrid');
            
            container.innerHTML = categories.map(cat => {
                const total = projectExpenses
                    .filter(exp => exp.category === cat.name)
                    .reduce((sum, exp) => sum + exp.amount, 0);
                
                return `
                    <div class="${cat.color} rounded-xl p-4 border-2 shadow-sm hover:shadow-md transition-all">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-2xl">${cat.icon}</span>
                            <p class="text-xs font-semibold">${cat.name}</p>
                        </div>
                        <p class="text-xl font-bold">${formatCurrency(total)}</p>
                    </div>
                `;
            }).join('');
        }

        function renderExpenses() {
            const projectExpenses = appState.expenses
                .filter(exp => exp.projectId === appState.activeProject)
                .sort((a, b) => new Date(b.date) - new Date(a.date));
            
            const container = document.getElementById('expensesList');

            if (projectExpenses.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl p-8 max-w-md mx-auto border-2 border-dashed border-indigo-200">
                            <p class="text-lg font-semibold text-gray-700 mb-2">No expenses yet</p>
                            <p class="text-sm text-gray-500">Click Add Expense to start tracking!</p>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = projectExpenses.map(expense => {
                const categoryStyle = categories.find(c => c.name === expense.category) || categories[categories.length - 1];
                return `
                    <div class="border-2 border-gray-200 rounded-xl p-5 hover:shadow-lg transition-all bg-white mb-3">
                        <div class="flex justify-between items-start flex-wrap gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-3 flex-wrap">
                                    <span class="px-4 py-1.5 ${categoryStyle.color} text-sm font-semibold rounded-full border-2">
                                        ${categoryStyle.icon} ${expense.category}
                                    </span>
                                    <span class="text-sm text-gray-500 flex items-center gap-1.5 bg-gray-100 px-3 py-1 rounded-full">
                                        📅 ${new Date(expense.date).toLocaleDateString('en-KE', { day: 'numeric', month: 'short', year: 'numeric' })}
                                    </span>
                                </div>
                                <h3 class="font-bold text-gray-900 mb-2 text-lg">${expense.description}</h3>
                                ${expense.vendor ? `<p class="text-sm text-gray-600 mb-2"><span class="font-semibold">Vendor:</span> ${expense.vendor}</p>` : ''}
                                ${expense.receiptName ? `
                                    <div class="flex items-center gap-2 mt-2">
                                        <a href="${expense.receipt}" download="${expense.receiptName}" class="text-sm text-green-600 hover:text-green-700 font-medium hover:underline">
                                            📎 ${expense.receiptName}
                                        </a>
                                    </div>
                                ` : ''}
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-2xl font-bold text-gray-900 bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-2 rounded-xl border-2 border-green-200">
                                    ${formatCurrency(expense.amount)}
                                </span>
                                <button onclick="editExpense(${expense.id})" class="p-2.5 text-blue-600 hover:bg-blue-50 rounded-xl transition border-2 border-transparent hover:border-blue-200" title="Edit">
                                    ✏️
                                </button>
                                <button onclick="deleteExpense(${expense.id})" class="p-2.5 text-red-600 hover:bg-red-50 rounded-xl transition border-2 border-transparent hover:border-red-200" title="Delete">
                                    🗑️
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Project functions
        function setActiveProject(projectId) {
            appState.activeProject = projectId;
            renderApp();
        }

        function showAddProjectModal() {
            document.getElementById('modalContainer').innerHTML = `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onclick="closeModal(event)">
                    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-md w-full" onclick="event.stopPropagation()">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-bold text-gray-800">Add New Project</h3>
                            <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl font-bold">×</button>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Project Name</label>
                                <input type="text" id="projectName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Guest House">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Budget (KES)</label>
                                <input type="number" id="projectBudget" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="5000000">
                            </div>
                            <div class="flex gap-3">
                                <button onclick="addProject()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-medium">Add Project</button>
                                <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 font-medium">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function addProject() {
            const name = document.getElementById('projectName').value;
            const budget = parseFloat(document.getElementById('projectBudget').value);

            if (!name || !budget) {
                alert('Please fill in all fields');
                return;
            }

            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
            appState.projects.push({
                id: Date.now(),
                name,
                budget,
                color: colors[appState.projects.length % colors.length]
            });

            closeModal();
            renderApp();
        }

        // Expense functions
        function showAddExpenseModal() {
            showExpenseModal();
        }

        function editExpense(expenseId) {
            const expense = appState.expenses.find(e => e.id === expenseId);
            if (expense) showExpenseModal(expense);
        }

        function showExpenseModal(expense = null) {
            const isEdit = expense !== null;
            const expenseData = expense || {
                date: new Date().toISOString().split('T')[0],
                category: 'Materials',
                description: '',
                amount: '',
                vendor: '',
                receipt: null,
                receiptName: ''
            };

            document.getElementById('modalContainer').innerHTML = `
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 overflow-y-auto" onclick="closeModal(event)">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full my-8 border-2 border-indigo-100" onclick="event.stopPropagation()">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-2xl font-bold text-gray-800">${isEdit ? '✏️ Edit Expense' : '➕ Add New Expense'}</h3>
                            <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-3xl font-bold">×</button>
                        </div>
                        <div class="space-y-5">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Date</label>
                                    <input type="date" id="expenseDate" value="${expenseData.date}" class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
                                    <select id="expenseCategory" class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                                        ${categories.map(cat => `<option value="${cat.name}" ${expenseData.category === cat.name ? 'selected' : ''}>${cat.icon} ${cat.name}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Description *</label>
                                <input type="text" id="expenseDescription" value="${expenseData.description}" class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Cement bags (50kg x 20)">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Amount (KES) *</label>
                                    <input type="number" id="expenseAmount" value="${expenseData.amount}" class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="15000">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Vendor</label>
                                    <input type="text" id="expenseVendor" value="${expenseData.vendor || ''}" class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g., Bamburi Cement">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Receipt</label>
                                <input type="file" id="expenseReceipt" accept="image/*,.pdf" class="w-full px-4 py-3 border-2 border-gray-300 rounded-xl" onchange="handleReceiptUpload(event)">
                                ${expenseData.receiptName ? `<p class="text-xs text-gray-500 mt-2">📎 Current: ${expenseData.receiptName}</p>` : ''}
                                <input type="hidden" id="receiptData" value="${expenseData.receipt || ''}">
                                <input type="hidden" id="receiptName" value="${expenseData.receiptName || ''}">
                            </div>
                            <div class="flex gap-4 pt-6 border-t-2 border-gray-200">
                                <button onclick="saveExpense(${isEdit ? expense.id : 'null'})" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-4 rounded-xl hover:from-blue-700 hover:to-indigo-800 transition-all font-bold text-lg shadow-lg uppercase">
                                    ✅ ${isEdit ? 'Update Expense' : 'Save Expense'}
                                </button>
                                <button onclick="closeModal()" class="flex-1 bg-gray-300 text-gray-800 py-4 rounded-xl hover:bg-gray-400 transition-all font-bold text-lg shadow-md uppercase">
                                    ❌ Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleReceiptUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    document.getElementById('receiptData').value = reader.result;
                    document.getElementById('receiptName').value = file.name;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveExpense(expenseId) {
            const date = document.getElementById('expenseDate').value;
            const category = document.getElementById('expenseCategory').value;
            const description = document.getElementById('expenseDescription').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const vendor = document.getElementById('expenseVendor').value;
            const receipt = document.getElementById('receiptData').value;
            const receiptName = document.getElementById('receiptName').value;

            if (!description || !amount) {
                alert('Please fill in required fields');
                return;
            }

            if (expenseId) {
                // Update existing expense
                const index = appState.expenses.findIndex(e => e.id === expenseId);
                if (index !== -1) {
                    appState.expenses[index] = {
                        ...appState.expenses[index],
                        date,
                        category,
                        description,
                        amount,
                        vendor,
                        receipt,
                        receiptName
                    };
                }
            } else {
                // Add new expense
                appState.expenses.push({
                    id: Date.now(),
                    projectId: appState.activeProject,
                    date,
                    category,
                    description,
                    amount,
                    vendor,
                    receipt,
                    receiptName
                });
            }

            closeModal();
            renderApp();
        }

        function deleteExpense(expenseId) {
            if (confirm('Are you sure you want to delete this expense?')) {
                appState.expenses = appState.expenses.filter(e => e.id !== expenseId);
                renderApp();
            }
        }

        function exportData() {
            const dataStr = JSON.stringify({ projects: appState.projects, expenses: appState.expenses }, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'construction-tracker-data.json';
            link.click();
        }

        function closeModal(event) {
            if (!event || event.target === event.currentTarget) {
                document.getElementById('modalContainer').innerHTML = '';
            }
        }

        // Auto-logout after 30 minutes
        let inactivityTimer;
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            if (appState.currentUser) {
                appState.lastActivity = Date.now();
                inactivityTimer = setTimeout(() => {
                    alert('You have been logged out due to inactivity');
                    logout();
                }, 30 * 60 * 1000); // 30 minutes
            }
        }

        // Track user activity
        document.addEventListener('mousemove', resetInactivityTimer);
        document.addEventListener('keypress', resetInactivityTimer);
        document.addEventListener('click', resetInactivityTimer);

        // Initialize
        resetInactivityTimer();
    </script>
</body>
</html>
